
name: Deploy Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "dashboard.css"
      - "dashboard.js"
      - "dashboard-data.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dashboard
        run: |
          mkdir -p public
          cp index.html dashboard.css dashboard.js public/
          if [ -f dashboard-data.json ]; then
            cp dashboard-data.json public/
          else
            echo '{"services":[],"checks":[]}' > public/dashboard-data.json
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
