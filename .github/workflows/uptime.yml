
name: Uptime Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uptime-watch-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name "emptyprocess"
          git config user.email "320864519+emptyprocess@users.noreply.github.com"

      - name: Monitor services and generate data
        run: python3 monitor.py

      - name: Commit monitoring report
        shell: bash
        run: |
          set -euo pipefail

          git add data/ dashboard-data.json
          git commit -m "monitor: service health $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Prepare dashboard
        run: |
          mkdir -p public
          cp index.html dashboard.css dashboard.js yard3d.js dashboard-data.json public/
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
